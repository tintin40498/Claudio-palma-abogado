<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Dr. Claudio Palma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0a1a2f; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { max-width: 400px; width: 100%; background: white; padding: 30px; border-radius: 10px; }
        h2 { color: #0a1a2f; text-align: center; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #0a1a2f; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        .logout { background: #dc3545; }
        .error { color: red; text-align: center; }
        .success { color: green; text-align: center; }
        .panel { display: none; }
        .preview { max-width: 200px; margin: 10px 0; }
        .attempts-counter { font-size: 0.8rem; color: #666; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login" class="login-box">
        <h2>🔐 Acceso Privado</h2>
        <input type="text" id="username" value="dr.palma" readonly style="background:#f5f5f5;">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="verificarLogin()">Ingresar</button>
        <div id="loginError" class="error"></div>
        <div id="attemptsDisplay" class="attempts-counter"></div>
    </div>

    <!-- PANEL DE PUBLICACIÓN -->
    <div id="panel" class="panel login-box">
        <h2>📝 Publicar caso</h2>
        <select id="area">
            <option value="Civil">Civil</option>
            <option value="Comercial">Comercial</option>
            <option value="Familiar">Familiar</option>
            <option value="Laboral">Laboral</option>
            <option value="ART">ART</option>
            <option value="Transito">Tránsito</option>
        </select>
        <input type="text" id="titulo" placeholder="Título">
        <textarea id="descripcion" rows="3" placeholder="Descripción"></textarea>
        <input type="text" id="resultado" placeholder="Resultado">
        <input type="file" id="foto" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="preview">
        <button onclick="publicarCaso()">📤 PUBLICAR</button>
        <p id="mensaje" class="success"></p>
        <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <!-- BLOQUEO -->
    <div id="blocked" class="login-box" style="display:none;">
        <div style="background:#dc3545; color:white; padding:20px; border-radius:5px; text-align:center;">
            <h3>⛔ BLOQUEADO</h3>
            <p>Demasiados intentos fallidos.</p>
            <p>Se avisó al Dr. Palma por WhatsApp.</p>
            <button onclick="location.reload()">Reintentar</button>
        </div>
    </div>

    <script>
        const CONTRASENA = "2121ñ@rt";
        const WHATSAPP = "5491153112273";
        const MAX_INTENTOS = 3;
        
        let intentos = parseInt(localStorage.getItem('intentos') || '0');
        let bloqueado = parseInt(localStorage.getItem('bloqueado') || '0');
        
        if (bloqueado > Date.now()) {
            document.getElementById('login').style.display = 'none';
            document.getElementById('blocked').style.display = 'block';
        }
        
        function verificarLogin() {
            if (bloqueado > Date.now()) return;
            
            const pass = document.getElementById('password').value;
            
            if (pass === CONTRASENA) {
                intentos = 0;
                localStorage.setItem('intentos', '0');
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
            } else {
                intentos++;
                localStorage.setItem('intentos', intentos);
                document.getElementById('loginError').innerText = `❌ Incorrecta. Intento ${intentos}/${MAX_INTENTOS}`;
                
                if (intentos >= MAX_INTENTOS) {
                    const hasta = Date.now() + 30 * 60 * 1000;
                    localStorage.setItem('bloqueado', hasta);
                    
                    fetch('https://api.ipify.org?format=json')
                        .then(r => r.json())
                        .then(data => {
                            const url = `https://wa.me/${WHATSAPP}?text=🔴 Alerta: alguien intentó entrar ${intentos} veces. IP: ${data.ip}`;
                            window.open(url, '_blank');
                        });
                    
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('blocked').style.display = 'block';
                }
            }
        }
        
        function cerrarSesion() {
            localStorage.removeItem('sesion');
            document.getElementById('login').style.display = 'block';
            document.getElementById('panel').style.display = 'none';
        }
        
        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('preview').src = e.target.result;
                reader.readAsDataURL(file);
            }
        }
        
        function publicarCaso() {
            const titulo = document.getElementById('titulo').value;
            const desc = document.getElementById('descripcion').value;
            const res = document.getElementById('resultado').value;
            
            if (!titulo || !desc || !res) {
                document.getElementById('mensaje').innerText = '❌ Completá todo';
                return;
            }
            
            const foto = document.getElementById('foto').files[0];
            if (foto) {
                const reader = new FileReader();
                reader.onload = (e) => guardar(e.target.result);
                reader.readAsDataURL(foto);
            } else {
                guardar('');
            }
        }
        
        function guardar(foto) {
            let casos = JSON.parse(localStorage.getItem('casos') || '[]');
            casos.unshift({
                id: Date.now(),
                area: document.getElementById('area').value,
                titulo: document.getElementById('titulo').value,
                descripcion: document.getElementById('descripcion').value,
                resultado: document.getElementById('resultado').value,
                foto: foto,
                fecha: new Date().toLocaleDateString()
            });
            localStorage.setItem('casos', JSON.stringify(casos));
            document.getElementById('mensaje').innerText = '✅ Publicado';
            document.getElementById('titulo').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('resultado').value = '';
            document.getElementById('foto').value = '';
            document.getElementById('preview').src = '';
        }
    </script>
</body>
  </html>
