backend:
  name: github
  repo: tintin40498/Claudio-palma-abogado
  branch: main
  auth_scope: repo
  # El Dr. Palma usará su propio usuario de GitHub

media_folder: "images/casos" # Las fotos se guardan acá
public_folder: "/images/casos"

collections:
  - name: "casos" # Colección de casos de éxito
    label: "Casos de Éxito"
    folder: "_casos" # Se guardan en esta carpeta
    create: true
    fields:
      - { label: "Título del Caso", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Área Legal", name: "area", widget: "select", options: ["Civil", "Comercial", "Familiar", "Laboral", "ART", "Tránsito"] }
      - { label: "Imagen Principal", name: "image", widget: "image" }
      - { label: "Descripción", name: "body", widget: "markdown" }
      - { label: "Resultado Obtenido", name: "resultado", widget: "string" }
